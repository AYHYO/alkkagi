<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#321b0e"><link rel="manifest" href="manifest.webmanifest"><title>알까기 1 vs 1</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app">
<section id="menu" class="screen active"><div class="woodhero"><div class="logo">알까기 <span>1 vs 1</span></div><div class="clash"><div class="hero-stone black"></div><div class="burst">✦</div><div class="hero-stone white"></div></div><p class="subtitle">한 손가락으로 밀어 승부하라</p></div><div class="menu-buttons"><button class="woodbtn primary" id="playBtn">▶ 플레이</button><button class="woodbtn" id="settingsBtn">⚙ 설정</button></div></section>
<section id="mode" class="screen"><header><button class="back" data-back="menu">‹</button><h2>알 종류를 선택하시오</h2></header><div class="modecards"><button class="modecard" data-mode="janggi"><div class="piece-icon red">馬</div><b>장기말</b><small>빨강 vs 파랑 · 9개씩</small></button><button class="modecard" data-mode="go"><div class="piece-icon">●</div><b>오목알</b><small>흑 vs 백 · 7개씩</small></button></div></section>
<section id="settings" class="screen"><header><button class="back" data-back="menu">‹</button><h2>설정</h2></header><div class="settingspanel"><label class="setting">효과음 <span id="volumeLabel">70%</span><input id="volume" type="range" min="0" max="100" value="70"></label><label class="setting toggle">진동 <input id="vibrate" type="checkbox" checked></label><p class="hint">설정은 이 기기에 저장됩니다.</p><button class="woodbtn" data-back="menu">닫기</button></div></section>
<section id="game" class="screen"><div class="hud"><div class="player"><div class="playerdot" id="dot1"></div><span id="p1label">플레이어 1</span><small id="p1count">남은 알 7</small></div><div class="timer" id="timer">--</div><div class="player right"><div class="playerdot" id="dot2"></div><span id="p2label">플레이어 2</span><small id="p2count">남은 알 7</small></div></div><div id="boardwrap"><canvas id="board"></canvas><div id="toast"></div><button id="pauseBtn" aria-label="일시정지">Ⅱ</button></div></section>
<div id="overlay" class="overlay hidden"><div class="modal" id="modal"></div></div>
</div><script src="game.js"></script></body></html>
