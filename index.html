<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1d140c;color:#f4e8d3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}body{display:flex;justify-content:center}.app{width:100%;height:100dvh;max-width:620px;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 9px env(safe-area-inset-bottom);background:radial-gradient(ellipse at center,#3a2918,#1c140c 78%);position:relative}header{height:38px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}.brand{font-size:13px;font-weight:950;letter-spacing:.08em}.btn{border:1px solid #8b6b43;background:#3c2a19;color:#f1d3a1;border-radius:9px;padding:7px 11px;font-size:11px;font-weight:850;touch-action:manipulation}.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:5px;width:100%;min-height:46px;padding:6px 9px;background:#332516;border:1px solid #80613d;border-radius:10px;flex-shrink:0}.hudside{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:900}.hudside.r{justify-content:flex-end;transform:rotate(180deg)}.n{font-size:17px;color:#f6d58f}.dot{width:10px;height:10px;border-radius:50%;background:#eee;box-shadow:0 0 0 2px #888}.dot.dark{background:#141414}.hudmid{text-align:center}.time{font-weight:950;font-size:19px;line-height:1}.turn{font-size:9px;color:#d5b47d;margin-top:2px}.arena{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;justify-items:center;align-items:center;gap:4px;padding:4px 0}.edge{min-height:24px;display:flex;align-items:center;justify-content:center;width:100%}.edge.top{transform:rotate(180deg)}.edgeLabel{font-size:10px;font-weight:850;letter-spacing:.06em;color:#d6b57d}.boardWrap{height:100%;width:100%;min-height:0;display:flex;align-items:center;justify-content:center}.board{position:relative;width:min(100%,calc(100dvh - 216px));max-width:500px;max-height:100%;aspect-ratio:1;background:repeating-linear-gradient(0deg,rgba(66,37,16,.035),rgba(66,37,16,.035) 2px,transparent 2px,transparent 8px),linear-gradient(140deg,#d4a66c,#b87f43 47%,#cf9f66);border:7px solid #593518;border-radius:3px;box-shadow:0 12px 30px #0008,inset 0 0 0 2px #e5b976;overflow:visible;touch-action:none}.board:before{content:"";position:absolute;inset:5%;border:1px solid #704b26;opacity:.45;pointer-events:none}.stone{position:absolute;border-radius:50%;z-index:3;box-shadow:inset -3px -5px 8px #0005,inset 2px 2px 5px #fff7,0 2px 4px #0008;touch-action:none;will-change:transform;transform:translate(-50%,-50%)}.stone.p1{background:radial-gradient(circle at 30% 25%,#fff,#dedede 52%,#aaa)}.stone.p2{background:radial-gradient(circle at 30% 25%,#666,#242424 48%,#070707)}.stone.sel{outline:3px solid #ffe09b;outline-offset:2px}.stone.fall{transition:transform .55s ease-in,opacity .55s ease-in;opacity:0}.controls{flex-shrink:0;display:flex;justify-content:center;min-height:29px;align-items:center}.controls.top{transform:rotate(180deg)}.ready{font-size:10px;padding:6px 10px}.status{font-size:10px;color:#d8b77f;min-height:15px;text-align:center;flex-shrink:0}.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;background:#24190ff2;border:1px solid #c9a56a;border-radius:12px;padding:12px 18px;font-size:20px;font-weight:950;white-space:nowrap;pointer-events:none;animation:fadeToast .55s forwards}.toast.flip{transform:translate(-50%,-50%) rotate(180deg)}@keyframes fadeToast{to{opacity:0}}.overlay{position:absolute;inset:0;z-index:20;background:#110b06ed;display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:min(100%,430px);max-height:94%;overflow:auto;background:linear-gradient(#3a2919,#21170e);border:1px solid #87633a;border-radius:17px;padding:17px;text-align:center;box-shadow:0 15px 45px #0009}.modal h1{font-size:24px;margin:0 0 9px}.modal p{font-size:13px;line-height:1.6;color:#efd4aa}.helpbox{text-align:left;background:#2a1e13;border-radius:10px;padding:10px;margin:10px 0;font-size:12px;line-height:1.7;color:#e9cda1}.modal .btn{margin:4px}.hidden{display:none!important}.smallnote{font-size:10px;color:#c5a575}
</style></head><body><main class="app">
<header><div class="brand">ALKKAGI <span style="color:#d8ae70">1 VS 1</span></div><button class="btn" id="help">규칙</button><button class="btn" id="pause">일시정지</button></header>
<div class="hud"><div class="hudside"><span class="dot"></span>1P <span class="n" id="c1">7</span></div><div class="hudmid"><div class="time" id="clock">--</div><div class="turn" id="turnText">READY</div></div><div class="hudside r"><span class="dot dark"></span>2P <span class="n" id="c2">7</span></div></div>
<section class="arena"><div class="edge top"><div class="edgeLabel">PLAYER 2 · 위쪽에서 플레이</div></div><div class="boardWrap"><div class="board" id="board"></div></div><div class="edge"><div class="edgeLabel">PLAYER 1 · 아래쪽에서 플레이</div></div></section>
<div class="controls top"><button class="btn ready" id="ready2">2P 배치 완료</button></div><div class="status" id="status">시작 화면</div><div class="controls"><button class="btn ready" id="ready1">1P 배치 완료</button></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"><h1>알까기 <span style="color:#d8ae70">1 vs 1</span></h1><p>폰을 세로로 두고 서로 반대편에서 마주 보세요. 중앙의 하나의 정사각형 판을 함께 사용합니다.</p><div class="helpbox">• 본인 차례에 알을 터치한 뒤 스와이프 방향으로 발사합니다.<br>• 발사 후 남은 시간과 관계없이 턴은 종료되고, 모든 알이 정지해야 다음 차례로 넘어갑니다.<br>• 판 밖으로 빠져나간 알은 떨어져 탈락합니다.</div><button class="btn" id="start">게임 시작</button><button class="btn" id="curlInfo">선공 컬링 설명</button></div></div>
</main>
<script>
(()=>{
const board=document.getElementById('board'), overlay=document.getElementById('overlay'), modal=document.getElementById('modal'), statusEl=document.getElementById('status'), clockEl=document.getElementById('clock'), turnEl=document.getElementById('turnText');
let stones=[],stage='menu',active=1,turnTime=10,remaining=10,moveWait=false,paused=false,raf=0,last=0,settleFrames=0,shotThisTurn=false,turns=[0,0],ready=[false,false],placementDeadline=0,curlShots=[null,null],curlPlayer=1,curlCountdown=0,selected=null,drag=null,penalty=false,mode='go',winner=null;
const R=.038, friction=.985, restitution=.68, stopSpeed=.025, maxLaunch=2.9;
const rand=(a,b)=>a+Math.random()*(b-a);function boardSize(){return board.clientWidth}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function addStone(p,x,y){let s={id:crypto.randomUUID(),p,x,y,vx:0,vy:0,r:R,alive:true,el:null,spin:0,placed:false};stones.push(s);renderStone(s);return s}function renderStone(s){if(!s.el){s.el=document.createElement('div');s.el.className='stone '+(s.p===1?'p1':'p2');board.appendChild(s.el)}const px=boardSize(),diam=Math.max(23,px*R*2);s.el.style.width=diam+'px';s.el.style.height=diam+'px';s.el.style.left=(s.x*px)+'px';s.el.style.top=(s.y*px)+'px';s.el.style.transform=`translate(-50%,-50%) rotate(${s.spin}deg)`}function updateCounts(){document.getElementById('c1').textContent=stones.filter(s=>s.alive&&s.p===1).length;document.getElementById('c2').textContent=stones.filter(s=>s.alive&&s.p===2).length}function status(t){statusEl.textContent=t}function showToast(text,p=1){let t=document.createElement('div');t.className='toast'+(p===2?' flip':'');t.textContent=text;document.querySelector('.app').appendChild(t);setTimeout(()=>t.remove(),550)}function clearStones(){stones.forEach(s=>s.el?.remove());stones=[];updateCounts()}
// lightweight rigid-disc simulation: friction, spin damping, restitution, mass-weighted impulses, wall contact.
function physics(dt){let moving=false;const b=boardSize();for(let s of stones){if(!s.alive||s.placed)continue;s.vx*=Math.pow(friction,dt*60);s.vy*=Math.pow(friction,dt*60);s.spin*=Math.pow(.96,dt*60);s.x+=s.vx*dt;s.y+=s.vy*dt;if(Math.hypot(s.vx,s.vy)>stopSpeed)moving=true}
for(let i=0;i<stones.length;i++){let a=stones[i];if(!a.alive||a.placed)continue;for(let j=i+1;j<stones.length;j++){let c=stones[j];if(!c.alive||c.placed)continue;let dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy),min=a.r+c.r;if(d<min&&d>0){let nx=dx/d,ny=dy/d,over=min-d;a.x-=nx*over*.5;a.y-=ny*over*.5;c.x+=nx*over*.5;c.y+=ny*over*.5;let rv=(c.vx-a.vx)*nx+(c.vy-a.vy)*ny;if(rv<0){let impulse=-(1+restitution)*rv/2;a.vx-=impulse*nx;a.vy-=impulse*ny;c.vx+=impulse*nx;c.vy+=impulse*ny;let tangent=-ny*nx+nx*ny;a.spin+=Math.abs(rv)*4;c.spin-=Math.abs(rv)*4}}}}
for(let s of stones){if(!s.alive||s.placed)continue;if(s.x<-s.r||s.x>1+s.r||s.y<-s.r||s.y>1+s.r){fallStone(s);continue}if(s.x<s.r){s.x=s.r;s.vx=Math.abs(s.vx)*.42}if(s.x>1-s.r){s.x=1-s.r;s.vx=-Math.abs(s.vx)*.42}if(s.y<s.r){s.y=s.r;s.vy=Math.abs(s.vy)*.42}if(s.y>1-s.r){s.y=1-s.r;s.vy=-Math.abs(s.vy)*.42}if(Math.hypot(s.vx,s.vy)>stopSpeed)moving=true;renderStone(s)}return moving}
function fallStone(s){if(!s.alive)return;s.alive=false;s.el.classList.add('fall');let size=boardSize();s.el.style.transform=`translate(-50%,-50%) translate(${s.x*size*.3}px,${s.y*size*.3}px) scale(.25) rotate(40deg)`;setTimeout(()=>s.el?.remove(),600);updateCounts();if(stage==='playing'&&!stones.some(q=>q.alive&&q.p===s.p))finishGame(3-s.p)}
function allSettled(){return stones.filter(s=>s.alive&&!s.placed).every(s=>Math.hypot(s.vx,s.vy)<stopSpeed)}function stopAll(){for(const s of stones){if(s.alive){s.vx=0;s.vy=0;s.spin=0;s.placed=false;renderStone(s)}}}
function initial(){clearStones();for(let p=1;p<=2;p++)for(let i=0;i<7;i++){let x=.18+(i%4)*.19+(i>3?.04:0),y=p===1?.78+Math.floor(i/4)*.09:.22-Math.floor(i/4)*.09;addStone(p,x,y)}stage='curl';curlShots=[null,null];curlPlayer=1;curlCountdown=3;remaining=3;turnEl.textContent='선공 컬링';status('컬링: 양쪽이 각자 1개씩 발사하여 중앙에 더 가까운 알이 선공');showToast('컬링 시작',1);tickTimerStart(3,'curl')}
let timerInterval=null;function tickTimerStart(seconds,what){clearInterval(timerInterval);remaining=seconds;clockEl.textContent=remaining;timerInterval=setInterval(()=>{if(paused)return;remaining--;clockEl.textContent=Math.max(0,remaining);if(remaining<=0){clearInterval(timerInterval);timerInterval=null;if(what==='curl'){if(!curlShots[curlPlayer-1]){curlShots[curlPlayer-1]='timeout';status(`P${curlPlayer} 컬링 시간 초과`)}if(curlPlayer===1){curlPlayer=2;curlCountdown=3;tickTimerStart(3,'curl')}else determineFirst()}else if(what==='placement'){for(let p=1;p<=2;p++)if(!ready[p-1])autoPlace(p);finishPlacement()}else if(what==='turn'){if(!shotThisTurn){status('시간 초과 — 발사하지 못했습니다.');endTurnWait()}}}},1000)}
function startCurlShotCountdown(){if(stage!=='curl')return;curlCountdown=3;remaining=3;status(`P${curlPlayer}: 자신의 아래쪽 시작 위치에서 중앙 방향으로 알을 밀어 발사하세요. ${curlCountdown}초`);showToast(`${curlCountdown}`,curlPlayer);tickTimerStart(3,'curl')}
function determineFirst(){if(stage!=='curl')return;let a=curlShots[0],b=curlShots[1];if(!a||!b||a==='timeout'||b==='timeout'){firstPlayer= a&&a!=='timeout'?1:b&&b!=='timeout'?2:Math.random()<.5?1:2}else{let d1=Math.abs(a.y-.5),d2=Math.abs(b.y-.5);firstPlayer=d1<d2?1:d2<d1?2:Math.random()<.5?1:2}active=firstPlayer;stage='placement';ready=[false,false];autoPlace(1);autoPlace(2);placementDeadline=20;turnEl.textContent='배치';status('말 배치: 자신의 진영(중앙선 기준 자기 쪽) 안에서 드래그 · 겹치지 않게');showToast(`선공 P${firstPlayer}`,firstPlayer);tickTimerStart(20,'placement')}
let firstPlayer=1;function autoPlace(p){let own=stones.filter(s=>s.alive&&s.p===p);own.forEach((s,i)=>{s.placed=true;s.vx=s.vy=0;let row=Math.floor(i/4),col=i%4;s.x=.25+col*.16+(row*.04);s.y=p===1?.72+row*.10:.28-row*.10;renderStone(s)})}
function placementReady(p){if(stage!=='placement')return;ready[p-1]=true;document.getElementById('ready'+p).textContent=`${p}P 배치 완료 ✓`;if(ready.every(Boolean))finishPlacement()}
function finishPlacement(){if(stage!=='placement')return;clearInterval(timerInterval);timerInterval=null;stones.forEach(s=>s.placed=false);stage='playing';active=firstPlayer;turns=[0,0];beginTurn()}
function beginTurn(){if(stage!=='playing')return;shotThisTurn=false;moveWait=false;selected=null;stones.forEach(s=>s.el?.classList.remove('sel'));turnTime=10;remaining=10;turnEl.textContent=`P${active} 차례`;status(`P${active} 턴 — 알을 스와이프해 발사 (10초)`);showToast(`${active} PLAYER 차례`,active);tickTimerStart(10,'turn')}
function endTurnWait(){if(stage!=='playing')return;clearInterval(timerInterval);timerInterval=null;moveWait=true;turnEl.textContent='충돌/움직임 정리 중';status('알이 움직이는 중 — 완전히 정지할 때까지 대기');settleFrames=0}
function turnAfterSettle(){if(stage!=='playing')return;moveWait=false;active=3-active;beginTurn()}
function finishGame(win){stage='gameover';winner=win;clearInterval(timerInterval);clockEl.textContent='—';turnEl.textContent='GAME OVER';modal.innerHTML=`<h1>PLAYER ${win} 승리</h1><p>남은 알: P1 ${stones.filter(s=>s.alive&&s.p===1).length} · P2 ${stones.filter(s=>s.alive&&s.p===2).length}</p><button class="btn" id="rematch">다시 하기</button><button class="btn" id="mainmenu">메인 메뉴</button>`;overlay.classList.remove('hidden');document.getElementById('rematch').onclick=()=>{overlay.classList.add('hidden');initial()};document.getElementById('mainmenu').onclick=()=>showMenu()}
function showMenu(){stage='menu';clearInterval(timerInterval);overlay.classList.remove('hidden');modal.innerHTML=`<h1>알까기 1 vs 1</h1><p>한 휴대폰을 세로로 놓고 마주 보며 플레이하세요.</p><div class="helpbox">• 중앙의 정사각형 오목판은 하나의 공용 플레이 공간입니다.<br>• 스와이프 발사, 마찰·관성·충돌, 판 밖 낙하 탈락이 적용됩니다.<br>• 턴 제한 10초. 발사 후 알이 멈출 때까지 대기합니다.</div><button class="btn" id="startAgain">게임 시작</button><button class="btn" id="curlHelp">선공 컬링 설명</button>`;document.getElementById('startAgain').onclick=()=>{overlay.classList.add('hidden');initial()};document.getElementById('curlHelp').onclick=showCurlInfo}
function showCurlInfo(){modal.innerHTML=`<h1>선공 결정 컬링</h1><div class="helpbox">1. P1과 P2가 각각 한 번씩 자신의 알을 발사합니다.<br>2. P1은 아래쪽에서 위쪽으로, P2는 위쪽에서 아래쪽으로 스와이프합니다.<br>3. 중앙에 더 가까이 멈춘 알의 플레이어가 선공입니다.<br>4. 3초 카운트다운 후 발사 기회가 시작됩니다. 알을 발사하면 즉시 상대 차례의 카운트다운으로 넘어가며, 움직임이 멈출 때까지 기다립니다.<br>5. 두 알이 중앙까지의 거리가 같으면 선공을 무작위로 정합니다.</div><button class="btn" id="curlBack">돌아가기</button><button class="btn" id="curlStart">컬링 시작</button>`;document.getElementById('curlBack').onclick=showMenu;document.getElementById('curlStart').onclick=()=>{overlay.classList.add('hidden');initial()}}
function launch(s,dx,dy,power){s.vx=dx*power;s.vy=dy*power;s.placed=false;s.el.classList.remove('sel');selected=null}
function boardPoint(e){let r=board.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
board.addEventListener('pointerdown',e=>{if(paused||!['curl','placement','playing'].includes(stage)||moveWait)return;e.preventDefault();let pos=boardPoint(e);let near=stones.filter(s=>s.alive&&Math.hypot(pos.x-s.x,pos.y-s.y)<s.r*1.45).sort((a,b)=>Math.hypot(pos.x-a.x,pos.y-a.y)-Math.hypot(pos.x-b.x,pos.y-b.y))[0];if(stage==='placement'){if(near&&ready[near.p-1]===false){drag={stone:near,start:pos,placement:true};board.setPointerCapture(e.pointerId)}}else if(stage==='curl'){if(curlShots[curlPlayer-1]||!near||near.p!==curlPlayer)return;let startingZone=curlPlayer===1?pos.y>.55:pos.y<.45;if(!startingZone)return;drag={stone:near,start:pos,placement:false,curl:true};board.setPointerCapture(e.pointerId)}else if(stage==='playing'&&active===near?.p&&!shotThisTurn&&!penalty&&near){let mandatory=turns[active-1]===2;if(mandatory)status('이번 턴은 공격해야 합니다!');drag={stone:near,start:pos,placement:false,shot:true,mandatory};near.el.classList.add('sel');board.setPointerCapture(e.pointerId)}});
board.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();let pos=boardPoint(e),s=drag.stone;if(drag.placement){let isOwn= s.p===1?pos.y>.52:pos.y<.48;if(isOwn){let blocked=stones.some(o=>o!==s&&o.alive&&Math.hypot(o.x-pos.x,o.y-pos.y)<o.r+s.r);if(!blocked){s.x=clamp(pos.x,s.r,1-s.r);s.y=clamp(pos.y,s.r,1-s.r);renderStone(s)}}}});
board.addEventListener('pointerup',e=>{if(!drag)return;let d=drag,pos=boardPoint(e),s=d.stone;drag=null;if(d.placement){s.placed=true;return}let dx=d.start.x-pos.x,dy=d.start.y-pos.y,len=Math.hypot(dx,dy);if(len<.035){s.el.classList.remove('sel');return}dx/=len;dy/=len;let power=clamp(len*5.8,.5,maxLaunch);launch(s,dx,dy,power);if(d.curl){curlShots[curlPlayer-1]={x:s.x,y:s.y};clearInterval(timerInterval);timerInterval=null;if(curlPlayer===1){curlPlayer=2;startCurlShotCountdown()}else{curlPlayer=0;stage='curlSettle';status('컬링 알이 멈출 때까지 대기');}}else if(d.shot){let toward= d.stone.p===1?dy<-.12:dy>.12;let third=turns[active-1]===2;turns[active-1]++;shotThisTurn=true;clearInterval(timerInterval);timerInterval=null;if(third&&!toward){penalty=true;status('공격을 하지 않았습니다. 패널티 적용!');setTimeout(()=>{let survivors=stones.filter(q=>q.alive&&q.p===active);if(survivors.length){let doomed=survivors[Math.floor(Math.random()*survivors.length)];fallStone(doomed)}penalty=false;endTurnWait()},1200)}else endTurnWait()} });
function frame(ts){raf=requestAnimationFrame(frame);if(paused)return;if(!last)last=ts;let dt=Math.min(.032,(ts-last)/1000);last=ts;if(stage==='curl'||stage==='curlSettle'||stage==='playing'||stage==='placement'){let moving=physics(dt);if(stage==='curlSettle'){if(!moving&&allSettled())settleFrames++;else settleFrames=0;if(settleFrames>=10){stopAll();stage='curl';determineFirst()}};if(stage==='playing'&&moveWait){if(!moving&&allSettled())settleFrames++;else settleFrames=0;if(settleFrames>=10){stopAll();turnAfterSettle()}}}}
